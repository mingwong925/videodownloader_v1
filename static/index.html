<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>片刻影片下載</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <nav class="topbar"><a class="brand" href="/">片刻<span>/</span></a><span class="status-dot">本機處理</span></nav>
      <section class="hero">
        <p class="eyebrow">ONE URL · FIFTEEN PLATFORMS</p>
        <h1>把喜歡的片段，<em>留下來。</em></h1>
        <p class="lede">貼上公開影片網址，選擇你要的格式。簡單、快速，檔案直接留在你的裝置。</p>
        <form id="download-form" class="download-form">
          <div class="url-row"><span class="link-icon">↗</span><input id="url" type="url" placeholder="貼上影片網址" required /><button type="submit">開始抓取 <span>→</span></button></div>
          <div class="options"><label>輸出 <select id="mode"><option value="video">影片 MP4</option><option value="audio">音訊 MP3</option></select></label><label id="quality-wrap">畫質 <select id="quality"><option value="best">最佳畫質</option><option value="1080">最高 1080p</option><option value="720">最高 720p</option><option value="480">最高 480p</option></select></label></div>
        </form>
        <div class="platforms"><span>支援</span><b>YouTube</b><b>Instagram</b><b>Facebook</b><b>X</b><b>TikTok</b><b>抖音</b><b>bilibili</b><b>Pinterest</b><b>Vimeo</b><b>Dailymotion</b><b>Twitch</b><b>SoundCloud</b><b>小紅書</b><b>微博</b><b>快手</b></div>
      </section>
      <section class="result-area"><div id="empty-state" class="empty-state"><span class="empty-mark">↓</span><p>你的下載佇列是空的</p><small>貼上連結後，檔案會出現在這裡</small></div><div id="job-list" class="job-list"></div></section>
      <footer><span>片刻 / v1.0</span><span>© 2026 Ming Wong</span><span>只下載你有權使用的內容</span></footer>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
